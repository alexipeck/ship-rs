[workspace]
resolver = "2"

[package]
name = "ship-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Self-hosted static sites on subdomains with Google and GitHub sign-in"
license = "GPL-2.0"
publish = false

[lib]
name = "ship"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cookie = { version = "0.18", features = ["private", "key-expansion"] }
form_urlencoded = "1"
hex = "0.4"
http = "1"
http-body-util = "0.1"
humantime = "2"
idna = "1"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
notify = "8"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
openidconnect = { version = "4", features = ["accept-string-booleans"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "hickory-dns"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync"] }
toml = "0.9"
tower = "0.5"
tower-http = { version = "0.6", features = ["timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "hickory-dns"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
